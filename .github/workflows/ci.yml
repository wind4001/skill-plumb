name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check CLI version
        run: node bin/skill-plumb.mjs --version

      - name: Run full test suite
        run: npm test

      - name: Run doctor on showcase examples
        run: node bin/skill-plumb.mjs doctor --skills-dir examples --no-mcp --json
